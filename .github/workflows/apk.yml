name: apk

# A signed APK for every push to main, or on demand: kept as a workflow artifact and
# published as the rolling "edge" prerelease, so a phone can download it directly from
# https://github.com/<owner>/<repo>/releases/tag/edge. Same KEYSTORE_* secrets as release.yml,
# so every build installs over the previous one.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch proot
        run: |
          sudo apt-get update -q && sudo apt-get install -yq libarchive-tools
          ndk=$(sed -n 's/^NDK_VERSION=//p' scripts/fetch-proot.sh)
          [ -d "$ANDROID_HOME/ndk/$ndk" ] || yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" >/dev/null
          scripts/fetch-proot.sh

      # Without a fixed key each build would need an uninstall, which deletes the Linux system.
      - name: Write the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "The KEYSTORE_* secrets aren't set; the APK would be debug-signed" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # The themes the APK downloads (OmarchyRelease): published once per pinned commit, before any APK needs them.
      - name: Publish the Omarchy pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref=$(sed -n 's/.*const val OMARCHY_REF = "\([0-9a-f]*\)".*/\1/p' app/src/main/kotlin/dev/omalauncher/theme/ThemeStore.kt)
          if ! gh release view "omarchy-$ref" >/dev/null 2>&1; then
            scripts/pack-omarchy.sh
            gh release create "omarchy-$ref" "omarchy-$ref.tar.gz" --target "$GITHUB_SHA" --latest=false \
              --title "Omarchy ${ref::12}" \
              --notes "github.com/omacom/omarchy at $ref, without the intro videos and lock-screen images (scripts/pack-omarchy.sh)."
          fi

      # Every build a newer version than the last, so Android and Obtainium see the update.
      - name: Build
        run: ./gradlew :app:assembleRelease -PciRun=${{ github.run_number }} -PciSha=${GITHUB_SHA::7}

      - name: Checksum
        id: apk
        run: |
          name=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          apk="omalauncher-$name-${GITHUB_SHA::7}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > SHA256SUMS
          echo "file=$apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: |
            ${{ steps.apk.outputs.file }}
            SHA256SUMS

      - name: Publish the edge prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete edge --yes --cleanup-tag 2>/dev/null || true
          gh release create edge "${{ steps.apk.outputs.file }}" SHA256SUMS --prerelease \
            --target "$GITHUB_SHA" --title "edge (${GITHUB_SHA::7})" \
            --notes "Latest build of main at $GITHUB_SHA."
